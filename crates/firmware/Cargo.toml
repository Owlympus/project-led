[package]
edition      = "2024"
license      = "MIT OR Apache-2.0"
name         = "firmware"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "firmware"
path = "./src/main.rs"
# No test harness on the chip: tests live in `led_core` and run on the Mac.
test  = false
bench = false

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32c6", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["embedded-storage", "esp32c6", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32c6",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32c6", "log-04"] }

# Wi-Fi + Bluetooth radio driver (it needs a heap, provided by esp-alloc).
esp-alloc = { version = "0.11.0", features = ["esp32c6"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "ble",
  "esp-alloc",
  "esp32c6",
  "log-04",
  "unstable",
  "wifi",
] }
# Memory map of the chip (used to size the heap).
esp-metadata-generated = { version = "0.5", features = ["esp32c6"] }

# Matter (ADR-0009). Not published on crates.io in a usable version yet:
# taken from GitHub, pinned to a commit (`rev`) so builds stay reproducible.
rs-matter-embassy = { git = "https://github.com/sysgrok/rs-matter-embassy", rev = "252cc60e7865a474b998e47fa0149af0a6648cd6", default-features = false, features = [
  "embassy-net",
  "esp",
  "log",
  "rustcrypto",
  "trouble",
] }
embassy-sync = "0.8"
# `select`: wait for whichever of two things happens first.
embassy-futures = "0.1.2"

# Saving Matter's data (pairing, last state) in flash (step 4c, ADR-0011):
# `esp-storage` reads and writes the flash, `esp-bootloader-esp-idf` (above,
# with `embedded-storage`) finds the NVS partition, and `embassy-embedded-hal`
# turns the blocking flash into the async one the Matter store expects.
esp-storage          = { version = "0.10.0", features = ["esp32c6", "embedded-storage"] }
embassy-embedded-hal = "0.6.0"

led_core = { path = "../core" }
ws2805   = { path = "../ws2805" }

static_cell      = "2.1.1"


# For fine-tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'

# `rs-matter-embassy` asks for `rs-matter` 0.4 from crates.io, but needs its
# newer GitHub version: `[patch]` swaps it everywhere in the dependency tree.
[patch.crates-io]
rs-matter = { git = "https://github.com/project-chip/rs-matter", rev = "a530a2972b860162527a9ec9df4ee62156b0ad69" }
